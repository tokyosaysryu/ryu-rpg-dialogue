<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Interactive RPG-style portfolio dialogue." />
  <title>Ryu — Dialogue System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #121212;
      --paper: #f1eadf;
      --paper-2: #e7ddcf;
      --cream: #fff8e8;
      --orange: #f66b38;
      --blue: #81a8d8;
      --yellow: #e7d052;
      --green: #8aa86b;
      --muted: #6c665e;
      --pixel: 3px;
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      min-width: 1420px;
      min-height: 610px;
      background: #101010;
      color: var(--ink);
    }

    body {
      display: grid;
      place-items: center;
      font-family: "Pixelify Sans", monospace;
      overflow: auto;
    }

    button,
    a { font: inherit; }

    .game-shell {
      position: relative;
      width: 1420px;
      height: 610px;
      overflow: hidden;
      background: var(--paper);
      border: var(--pixel) solid var(--ink);
      box-shadow: 8px 8px 0 #000;
      image-rendering: pixelated;
    }

    .top-header {
      height: 66px;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: stretch;
      border-bottom: var(--pixel) solid var(--ink);
      background: var(--cream);
    }

    .brand-block {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 0 20px;
      border-right: var(--pixel) solid var(--ink);
    }

    .brand-mark {
      width: 29px;
      height: 29px;
      background: var(--orange);
      border: var(--pixel) solid var(--ink);
      box-shadow: 4px 4px 0 var(--ink);
    }

    .brand-copy {
      display: flex;
      align-items: baseline;
      gap: 12px;
      text-transform: uppercase;
      letter-spacing: .02em;
    }

    .brand-copy strong {
      font-size: 23px;
      font-weight: 700;
    }

    .brand-copy span {
      color: var(--muted);
      font-size: 14px;
    }

    .date-header {
      display: grid;
      grid-template-columns: 152px 120px 112px 122px;
      height: 100%;
    }

    .date-cell {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 14px;
      border-left: var(--pixel) solid var(--ink);
      text-transform: uppercase;
    }

    .date-cell:first-child { border-left: 0; }

    .date-cell .label {
      color: var(--muted);
      font-size: 11px;
      line-height: 1;
      margin-bottom: 5px;
    }

    .date-cell .value {
      font-size: 19px;
      font-weight: 700;
      line-height: 1;
    }

    .date-cell.location {
      background: var(--yellow);
    }

    .middle {
      height: 366px;
      display: grid;
      grid-template-columns: 230px 1fr;
      border-bottom: var(--pixel) solid var(--ink);
    }

    .link-rail {
      background: var(--paper-2);
      border-right: var(--pixel) solid var(--ink);
      padding: 18px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .rail-title {
      font-size: 13px;
      color: var(--muted);
      text-transform: uppercase;
      margin: 1px 2px 6px;
    }

    .pixel-link {
      position: relative;
      min-height: 57px;
      display: grid;
      grid-template-columns: 32px 1fr 16px;
      align-items: center;
      gap: 8px;
      padding: 0 12px;
      color: var(--ink);
      background: var(--cream);
      text-decoration: none;
      text-transform: uppercase;
      border: var(--pixel) solid var(--ink);
      box-shadow: 4px 4px 0 var(--ink);
      transition: transform .08s linear, box-shadow .08s linear, background .08s linear;
    }

    .pixel-link:hover,
    .pixel-link:focus-visible {
      background: var(--yellow);
      outline: none;
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 var(--ink);
    }

    .pixel-link .icon {
      width: 22px;
      height: 22px;
      display: grid;
      place-items: center;
      border: 2px solid var(--ink);
      background: var(--blue);
      font-size: 13px;
    }

    .pixel-link:nth-of-type(3) .icon { background: var(--orange); }
    .pixel-link:nth-of-type(4) .icon { background: var(--green); }

    .pixel-link .name {
      font-size: 15px;
      font-weight: 700;
    }

    .pixel-link .arrow {
      font-size: 17px;
      text-align: right;
    }

    .rail-footer {
      margin-top: auto;
      padding: 12px;
      background: var(--ink);
      color: var(--paper);
      font-size: 12px;
      line-height: 1.35;
      text-transform: uppercase;
    }

    .stage {
      position: relative;
      overflow: hidden;
      background: #c7d0d0;
    }

    .background-layer,
    .stage-fallback {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .background-layer {
      z-index: 0;
      object-fit: cover;
      object-position: center;
      image-rendering: pixelated;
    }

    .stage-fallback {
      z-index: -1;
      background:
        linear-gradient(90deg, transparent 0 49%, rgba(0,0,0,.05) 49% 51%, transparent 51% 100%),
        linear-gradient(rgba(255,255,255,.2) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.2) 1px, transparent 1px),
        #bcc8c9;
      background-size: 100% 100%, 28px 28px, 28px 28px, auto;
    }

    .stage-label {
      position: absolute;
      z-index: 3;
      top: 16px;
      left: 18px;
      padding: 7px 10px;
      background: var(--cream);
      border: var(--pixel) solid var(--ink);
      box-shadow: 3px 3px 0 var(--ink);
      font-size: 12px;
      text-transform: uppercase;
    }

    .character {
      position: absolute;
      z-index: 2;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: 56% 100%;
      image-rendering: pixelated;
      transition: opacity .12s linear;
    }

    .character.switching { opacity: .2; }

    .stage-deco {
      position: absolute;
      z-index: 1;
      border: var(--pixel) solid var(--ink);
      background: var(--orange);
    }

    .stage-deco.one {
      width: 28px;
      height: 28px;
      right: 26px;
      top: 26px;
    }

    .stage-deco.two {
      width: 58px;
      height: 15px;
      right: 24px;
      bottom: 30px;
      background: var(--yellow);
    }

    .bottom-panel {
      height: 178px;
      background: var(--cream);
      display: grid;
      grid-template-rows: 32px 1fr;
    }

    .dialogue-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 15px;
      border-bottom: var(--pixel) solid var(--ink);
      background: var(--yellow);
      text-transform: uppercase;
      font-size: 13px;
    }

    .dialogue-bar strong { font-size: 14px; }

    .dialogue-content {
      position: relative;
      padding: 14px 16px 15px;
      overflow: hidden;
    }

    .questions-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px 12px;
    }

    .question-button,
    .nav-button {
      border: var(--pixel) solid var(--ink);
      background: var(--paper);
      color: var(--ink);
      box-shadow: 4px 4px 0 var(--ink);
      cursor: pointer;
      transition: transform .08s linear, box-shadow .08s linear, background .08s linear;
    }

    .question-button {
      min-height: 54px;
      display: grid;
      grid-template-columns: 38px 1fr 18px;
      align-items: center;
      gap: 8px;
      padding: 0 12px;
      text-align: left;
    }

    .question-button:hover,
    .question-button:focus-visible,
    .nav-button:hover,
    .nav-button:focus-visible {
      background: var(--blue);
      outline: none;
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 var(--ink);
    }

    .question-number {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      background: var(--ink);
      color: var(--cream);
      font-size: 12px;
    }

    .question-label {
      font-size: 16px;
      line-height: 1.08;
    }

    .answer-view {
      height: 100%;
      display: grid;
      grid-template-columns: 1fr 255px;
      gap: 18px;
      align-items: stretch;
    }

    .answer-copy {
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-width: 0;
      padding: 0 4px;
    }

    .answer-question {
      margin: 0 0 6px;
      color: var(--muted);
      font-size: 13px;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .answer-text {
      margin: 0;
      font-size: 20px;
      line-height: 1.22;
    }

    .answer-controls {
      display: grid;
      grid-template-rows: 1fr 1fr;
      gap: 9px;
    }

    .nav-button {
      width: 100%;
      padding: 0 12px;
      text-transform: uppercase;
      font-size: 14px;
      font-weight: 700;
    }

    .next-button { background: var(--orange); }
    .back-button { background: var(--paper-2); }

    .page-counter {
      position: absolute;
      right: 290px;
      bottom: 9px;
      font-size: 11px;
      color: var(--muted);
    }

    .hidden { display: none !important; }

    .swipe-transition {
      position: absolute;
      inset: 0;
      z-index: 100;
      pointer-events: none;
      transform: translateX(-102%);
      background: var(--ink);
    }

    .swipe-transition::after {
      content: "";
      position: absolute;
      top: 0;
      right: 0;
      width: 18px;
      height: 100%;
      background: var(--orange);
    }

    .swipe-transition.active {
      animation: pixelSwipe .58s steps(8, end) both;
    }

    @keyframes pixelSwipe {
      0% { transform: translateX(-102%); }
      45%, 55% { transform: translateX(0); }
      100% { transform: translateX(102%); }
    }

    @media (prefers-reduced-motion: reduce) {
      .swipe-transition.active { animation-duration: .01ms; }
      * { transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="game-shell" aria-label="Interactive portfolio dialogue system">
    <header class="top-header">
      <div class="brand-block">
        <span class="brand-mark" aria-hidden="true"></span>
        <div class="brand-copy">
          <strong>Ryu Dialogue System</strong>
          <span>Interactive application / Fudge</span>
        </div>
      </div>

      <div class="date-header" aria-label="Tokyo date">
        <div class="date-cell">
          <span class="label">Day</span>
          <span class="value" id="dayValue">Thursday</span>
        </div>
        <div class="date-cell">
          <span class="label">Date</span>
          <span class="value" id="dateValue">20 Aug</span>
        </div>
        <div class="date-cell">
          <span class="label">Year</span>
          <span class="value" id="yearValue">2026</span>
        </div>
        <div class="date-cell location">
          <span class="label">Location</span>
          <span class="value">Tokyo</span>
        </div>
      </div>
    </header>

    <section class="middle">
      <nav class="link-rail" aria-label="External links">
        <div class="rail-title">External links</div>

        <a class="pixel-link" href="https://www.ryutanaka.com/" data-external>
          <span class="icon">01</span>
          <span class="name">Portfolio</span>
          <span class="arrow">↗</span>
        </a>

        <a class="pixel-link" href="https://github.com/tokyosaysryu" data-external>
          <span class="icon">02</span>
          <span class="name">GitHub</span>
          <span class="arrow">↗</span>
        </a>

        <a class="pixel-link" href="https://www.fudgeanimation.com/" data-external>
          <span class="icon">03</span>
          <span class="name">Fudge</span>
          <span class="arrow">↗</span>
        </a>

        <div class="rail-footer">
          SELECT A LINK<br>
          OR ASK ME SOMETHING ↓
        </div>
      </nav>

      <div class="stage">
        <div class="stage-fallback" aria-hidden="true"></div>
        <img class="background-layer" src="assets/background.gif" alt="" aria-hidden="true" />
        <div class="stage-label" id="status">Idle / Waiting</div>
        <div class="stage-deco one" aria-hidden="true"></div>
        <div class="stage-deco two" aria-hidden="true"></div>
        <img id="character" class="character" src="assets/idle.gif" alt="Animated character in an idle pose" />
      </div>
    </section>

    <section class="bottom-panel">
      <div class="dialogue-bar">
        <strong>Dialogue / Ask me something</strong>
        <span id="dialogueStatus">04 questions available</span>
      </div>

      <div class="dialogue-content">
        <div class="questions-grid" id="questionsGrid"></div>

        <div class="answer-view hidden" id="answerView">
          <div class="answer-copy">
            <p class="answer-question" id="answerQuestion"></p>
            <p class="answer-text" id="answerText" aria-live="polite"></p>
          </div>
          <div class="answer-controls">
            <button class="nav-button next-button hidden" id="nextButton" type="button">Next →</button>
            <button class="nav-button back-button" id="backButton" type="button">← Questions</button>
          </div>
          <span class="page-counter" id="pageCounter"></span>
        </div>
      </div>
    </section>

    <div class="swipe-transition" id="swipeTransition" aria-hidden="true"></div>
  </main>

  <script>
    const dialogue = [
      {
        question: "Why would you want to work with us?",
        pages: [
          "Because Fudge seem to care about the same thing I do — using animation to make the delivery of ideas feel genuine, engaging and memorable.",
          "I also like the idea of working with a small team where people actually bounce ideas off each other and make things better together."
        ],
        gif: "assets/reaction-awesome.gif",
        status: "Excited / Fudge"
      },
      {
        question: "Where are you based?",
        pages: [
          "Tokyo, Japan — surrounded by plenty of good food, visual inspiration and far too many sub cultures and hobbies to get into."
        ],
        gif: "assets/reaction-tokyo.gif",
        status: "Based / Tokyo"
      },
      {
        question: "What do you like to do with your time?",
        pages: [
          "Mostly making things I'm curious about. I experiment with 3D, motion, interactive design and occasionally work on my own game.",
          "When I’m away from the screen, I’m usually spending time with my family or making camp fire."
        ],
        gif: "assets/reaction-make.gif",
        status: "Curious / Making"
      },
      {
        question: "Tell us a little about yourself.",
        pages: [
          "I’m a motion-led designer with 8+ years across animation, 3D, branding and film.",
          "I started out studying architecture, somehow ended up making things move, and never really looked back.",
          "I’m a curious person by nature, love learning new tools, and probably spend more time than necessary fixing tiny details nobody else notices."
        ],
        gif: "assets/reaction-about.gif",
        status: "About / Ryu"
      }
    ];

    const idleGif = "assets/idle.gif";
    const character = document.getElementById("character");
    const status = document.getElementById("status");
    const questionsGrid = document.getElementById("questionsGrid");
    const answerView = document.getElementById("answerView");
    const answerQuestion = document.getElementById("answerQuestion");
    const answerText = document.getElementById("answerText");
    const nextButton = document.getElementById("nextButton");
    const backButton = document.getElementById("backButton");
    const pageCounter = document.getElementById("pageCounter");
    const dialogueStatus = document.getElementById("dialogueStatus");
    const swipeTransition = document.getElementById("swipeTransition");

    let activeItem = null;
    let activePage = 0;
    let transitioning = false;

    function updateTokyoDate() {
      const now = new Date();
      const parts = new Intl.DateTimeFormat("en-US", {
        timeZone: "Asia/Tokyo",
        weekday: "long",
        day: "2-digit",
        month: "short",
        year: "numeric"
      }).formatToParts(now);

      const get = type => parts.find(part => part.type === type)?.value || "";
      document.getElementById("dayValue").textContent = get("weekday");
      document.getElementById("dateValue").textContent = `${get("day")} ${get("month")}`;
      document.getElementById("yearValue").textContent = get("year");
    }

    function switchGif(src, alt, label) {
      character.classList.add("switching");
      window.setTimeout(() => {
        character.src = src;
        character.alt = alt;
        status.textContent = label;
        character.classList.remove("switching");
      }, 100);
    }

    function withSwipe(callback) {
      if (transitioning) return;
      transitioning = true;
      swipeTransition.classList.remove("active");
      void swipeTransition.offsetWidth;
      swipeTransition.classList.add("active");

      window.setTimeout(callback, 265);
      window.setTimeout(() => {
        swipeTransition.classList.remove("active");
        transitioning = false;
      }, 600);
    }

    function renderQuestions() {
      activeItem = null;
      activePage = 0;
      questionsGrid.innerHTML = "";
      questionsGrid.classList.remove("hidden");
      answerView.classList.add("hidden");
      dialogueStatus.textContent = "04 questions available";
      switchGif(idleGif, "Animated character in an idle pose", "Idle / Waiting");

      dialogue.forEach((item, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "question-button";
        button.innerHTML = `
          <span class="question-number">0${index + 1}</span>
          <span class="question-label">${item.question}</span>
          <span>→</span>
        `;
        button.addEventListener("click", () => withSwipe(() => showAnswer(index)));
        questionsGrid.appendChild(button);
      });
    }

    function showAnswer(index) {
      activeItem = dialogue[index];
      activePage = 0;
      questionsGrid.classList.add("hidden");
      answerView.classList.remove("hidden");
      switchGif(activeItem.gif, `Animated character reaction: ${activeItem.status}`, activeItem.status);
      renderAnswerPage();
    }

    function renderAnswerPage() {
      if (!activeItem) return;
      answerQuestion.textContent = activeItem.question;
      answerText.textContent = activeItem.pages[activePage];
      const total = activeItem.pages.length;
      const hasNext = activePage < total - 1;
      nextButton.classList.toggle("hidden", !hasNext);
      pageCounter.textContent = total > 1 ? `${activePage + 1} / ${total}` : "";
      dialogueStatus.textContent = total > 1 ? `Answer page ${activePage + 1} / ${total}` : "Answer";
    }

    nextButton.addEventListener("click", () => {
      if (!activeItem || activePage >= activeItem.pages.length - 1) return;
      withSwipe(() => {
        activePage += 1;
        renderAnswerPage();
      });
    });

    backButton.addEventListener("click", () => withSwipe(renderQuestions));

    document.querySelectorAll("[data-external]").forEach(link => {
      link.addEventListener("click", event => {
        event.preventDefault();
        const destination = link.href;
        withSwipe(() => { window.location.href = destination; });
      });
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape" && activeItem) {
        withSwipe(renderQuestions);
      }
    });

    updateTokyoDate();
    window.setInterval(updateTokyoDate, 60000);
    renderQuestions();
  </script>
</body>
</html>
